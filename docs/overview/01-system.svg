<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="1 · The whole robot at a glance"><title>1 · The whole robot at a glance</title><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d4c41"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c25e00"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e35b1"/></marker></defs>
<rect x="0" y="0" width="1200" height="700" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="40" y="50" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1a2b30" text-anchor="start">1 · The whole robot at a glance</text>
<text x="40" y="78" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5f6f75" text-anchor="start">What each part does, and how the parts talk to each other</text>
<rect x="40" y="150" width="230" height="130" rx="10.0" fill="#e6eef9" stroke="#1565c0" stroke-width="1.8"/>
<text x="54" y="174" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1565c0" text-anchor="start">Xbox controller</text>
<text x="54" y="194" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">The driver: sticks</text>
<text x="54" y="212" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">and buttons</text>
<rect x="380" y="120" width="420" height="330" rx="10.0" fill="#e3f2ef" stroke="#0d7a69" stroke-width="1.8"/>
<text x="394" y="144" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d7a69" text-anchor="start">Raspberry Pi Zero 2 W</text>
<text x="396" y="165" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6f75" text-anchor="start">Decides what the robot should do</text>
<rect x="400" y="185" width="380" height="120" rx="10.0" fill="#ffffff" stroke="#0d7a69" stroke-width="1.8"/>
<text x="414" y="209" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d7a69" text-anchor="start">Driving service (Node.js)</text>
<text x="414" y="228" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Reads the controller 50 times a second</text>
<text x="414" y="246" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Checks every move against reach and joint limits</text>
<text x="414" y="264" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Sends commands: enable, walk, stand, stop…</text>
<rect x="400" y="320" width="380" height="110" rx="10.0" fill="#ffffff" stroke="#0d7a69" stroke-width="1.8"/>
<text x="414" y="344" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d7a69" text-anchor="start">Live View web server</text>
<text x="414" y="363" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Shows the robot live in any browser</text>
<text x="414" y="381" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Read-only: it never sends commands</text>
<rect x="910" y="120" width="250" height="330" rx="10.0" fill="#efeaf8" stroke="#5e35b1" stroke-width="1.8"/>
<text x="924" y="144" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5e35b1" text-anchor="start">Servo 2040</text>
<text x="924" y="164" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">MicroPython: motion_bridge.py</text>
<text x="924" y="200" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Runs the walking gait itself</text>
<text x="924" y="218" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Inverse kinematics every 20 ms</text>
<text x="924" y="236" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Drives 18 servo outputs</text>
<text x="924" y="254" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Measures battery volts and amps</text>
<text x="924" y="290" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Watchdog: no message from</text>
<text x="924" y="308" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">the Pi for 3 s → motors off</text>
<rect x="910" y="540" width="250" height="120" rx="10.0" fill="#fdf0e3" stroke="#c25e00" stroke-width="1.8"/>
<text x="924" y="564" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#c25e00" text-anchor="start">18 servos</text>
<text x="924" y="584" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">6 legs × 3 joints:</text>
<text x="924" y="602" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">hip · upper leg · lower leg</text>
<rect x="380" y="545" width="420" height="115" rx="10.0" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.8"/>
<text x="394" y="569" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2e7d32" text-anchor="start">Laptops, phones, projector</text>
<text x="394" y="589" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Live View: http://hexapod.local:5181</text>
<text x="394" y="607" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Up to 40 viewers at once</text>
<rect x="40" y="395" width="230" height="115" rx="10.0" fill="#f3ede9" stroke="#6d4c41" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="54" y="419" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6d4c41" text-anchor="start">RPLIDAR C1</text>
<text x="54" y="439" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">360° laser scanner</text>
<text x="54" y="457" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Planned: wired, no software yet</text>
<rect x="40" y="570" width="230" height="90" rx="10.0" fill="#fbe9e9" stroke="#c62828" stroke-width="1.8"/>
<text x="54" y="594" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#c62828" text-anchor="start">Battery</text>
<text x="54" y="614" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Powers everything:</text>
<text x="54" y="632" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">see diagram 2</text>
<path d="M270,215 L330,215 L330,245 L398,245" fill="none" stroke="#1565c0" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<text x="330" y="202" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1565c0" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Bluetooth</text>
<path d="M782,245 L908,245" fill="none" stroke="#5e35b1" stroke-width="2.2" stroke-linejoin="round" marker-start="url(#ah-purple)" marker-end="url(#ah-purple)"/>
<text x="845" y="232" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5e35b1" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">UART wires</text>
<text x="845" y="268" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5e35b1" text-anchor="middle">115 200 baud</text>
<text x="845" y="284" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5e35b1" text-anchor="middle">JSON text lines</text>
<path d="M1035,452 L1035,538" fill="none" stroke="#c25e00" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-orange)"/>
<text x="1047" y="500" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#c25e00" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">PWM pulses ×18</text>
<path d="M590,432 L590,543" fill="none" stroke="#2e7d32" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-green)"/>
<text x="602" y="482" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2e7d32" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Wi-Fi: web page</text>
<text x="602" y="499" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2e7d32" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">and live updates</text>
<path d="M272,440 L378,440" fill="none" stroke="#6d4c41" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#ah-brown)"/>
<text x="325" y="428" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6d4c41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">USB</text>
</svg>
