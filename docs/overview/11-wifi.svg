<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="11 · Wi-Fi: joined or hotspot"><title>11 · Wi-Fi: joined or hotspot</title><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2b30"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c25e00"/></marker></defs>
<rect x="0" y="0" width="1200" height="700" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="40" y="50" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1a2b30" text-anchor="start">11 · Wi-Fi: joined or hotspot</text>
<text x="40" y="78" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5f6f75" text-anchor="start">deploy/wifi/hexapod-wifi, run by a timer every minute (first check 45 s after power-on)</text>
<rect x="40" y="150" width="260" height="110" rx="10.0" fill="#eef1f2" stroke="#78868b" stroke-width="1.8"/>
<text x="54" y="174" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1a2b30" text-anchor="start">Power on</text>
<text x="54" y="194" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">NetworkManager tries the</text>
<text x="54" y="212" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">saved networks (Robocop)</text>
<rect x="450" y="120" width="300" height="130" rx="10.0" fill="#e8f3e9" stroke="#2e7d32" stroke-width="1.8"/>
<text x="464" y="144" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2e7d32" text-anchor="start">Station mode</text>
<text x="464" y="164" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Joined Robocop</text>
<text x="464" y="182" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Address from the router,</text>
<text x="464" y="200" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">e.g. 10.52.126.57</text>
<rect x="450" y="360" width="300" height="120" rx="10.0" fill="#eef1f2" stroke="#78868b" stroke-width="1.8"/>
<text x="464" y="384" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1a2b30" text-anchor="start">Not connected</text>
<text x="464" y="404" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Waiting: NetworkManager</text>
<text x="464" y="422" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">keeps trying for 30 s</text>
<rect x="880" y="340" width="280" height="160" rx="10.0" fill="#fdf0e3" stroke="#c25e00" stroke-width="1.8"/>
<text x="894" y="364" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#c25e00" text-anchor="start">Hotspot mode</text>
<text x="894" y="384" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">The robot’s own network:</text>
<text x="894" y="402" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Hexapod-XXXX</text>
<text x="894" y="420" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">The Pi is always 10.42.0.1</text>
<text x="894" y="438" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Live View:</text>
<text x="894" y="456" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">http://10.42.0.1:5181</text>
<path d="M300,190 L448,190" fill="none" stroke="#2e7d32" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-green)"/>
<text x="374" y="180" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2e7d32" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">connected</text>
<path d="M170,260 L170,420 L448,420" fill="none" stroke="#1a2b30" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-ink)"/>
<text x="300" y="410" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a2b30" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">none in range</text>
<path d="M750,420 L878,420" fill="none" stroke="#c25e00" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-orange)"/>
<text x="814" y="368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c25e00" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">still nothing</text>
<text x="814" y="385" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c25e00" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">(≈75 s after</text>
<text x="814" y="402" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c25e00" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">power-on)</text>
<path d="M1020,340 L1020,185 L752,185" fill="none" stroke="#2e7d32" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-green)"/>
<text x="1008" y="260" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2e7d32" text-anchor="end" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">every 10 min, if no device is</text>
<text x="1008" y="277" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2e7d32" text-anchor="end" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">connected: try saved networks</text>
<path d="M560,250 L560,358" fill="none" stroke="#1a2b30" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-ink)"/>
<text x="572" y="310" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2b30" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">network lost</text>
<rect x="40" y="540" width="1120" height="118" rx="10.0" fill="#e3f2ef" stroke="#0d7a69" stroke-width="1.8"/>
<text x="54" y="564" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d7a69" text-anchor="start">Choosing the mode (on the Pi)</text>
<text x="54" y="583" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">sudo hexapod-wifi auto        joined if possible, otherwise hotspot (default)</text>
<text x="54" y="601" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">sudo hexapod-wifi hotspot     always the hotspot: a classroom with no network</text>
<text x="54" y="619" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">sudo hexapod-wifi station     never the hotspot · reconnect · test-hotspot 5 (hotspot for 5 minutes)</text>
</svg>
