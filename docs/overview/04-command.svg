<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1030" width="1200" height="1030" role="img" aria-label="4 · The journey of one command"><title>4 · The journey of one command</title><defs><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c25e00"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e35b1"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d7a69"/></marker></defs>
<rect x="0" y="0" width="1200" height="1030" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="40" y="50" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1a2b30" text-anchor="start">4 · The journey of one command</text>
<text x="40" y="78" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5f6f75" text-anchor="start">From pushing the stick to the legs moving, and back to standing still</text>
<rect x="20" y="100" width="200" height="58" rx="10.0" fill="#e6eef9" stroke="#1565c0" stroke-width="1.8"/>
<text x="120.0" y="124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1565c0" text-anchor="middle">You</text>
<text x="120.0" y="143" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="middle">Xbox controller</text>
<line x1="120" y1="160" x2="120" y2="1010" stroke="#c9d2d6" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="255" y="100" width="200" height="58" rx="10.0" fill="#e6eef9" stroke="#1565c0" stroke-width="1.8"/>
<text x="355.0" y="124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1565c0" text-anchor="middle">Drive loop</text>
<text x="355.0" y="143" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="middle">controls.js</text>
<line x1="355" y1="160" x2="355" y2="1010" stroke="#c9d2d6" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="500" y="100" width="200" height="58" rx="10.0" fill="#e3f2ef" stroke="#0d7a69" stroke-width="1.8"/>
<text x="600.0" y="124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d7a69" text-anchor="middle">RobotController</text>
<text x="600.0" y="143" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="middle">robot.js on the Pi</text>
<line x1="600" y1="160" x2="600" y2="1010" stroke="#c9d2d6" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="750" y="100" width="200" height="58" rx="10.0" fill="#efeaf8" stroke="#5e35b1" stroke-width="1.8"/>
<text x="850.0" y="124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5e35b1" text-anchor="middle">Servo 2040</text>
<text x="850.0" y="143" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="middle">motion_bridge.py</text>
<line x1="850" y1="160" x2="850" y2="1010" stroke="#c9d2d6" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="980" y="100" width="200" height="58" rx="10.0" fill="#fdf0e3" stroke="#c25e00" stroke-width="1.8"/>
<text x="1080.0" y="124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#c25e00" text-anchor="middle">18 servos</text>
<text x="1080.0" y="143" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="middle">hip · upper · lower</text>
<line x1="1080" y1="160" x2="1080" y2="1010" stroke="#c9d2d6" stroke-width="2" stroke-dasharray="4 6"/>
<circle cx="26.0" cy="207.0" r="12" fill="#1a2b30" stroke="none" stroke-width="1.5"/>
<text x="26" y="212" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<path d="M126,212 L347,212" fill="none" stroke="#1565c0" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<text x="237.5" y="202" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1565c0" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Push the left stick forward</text>
<rect x="363" y="230" width="210" height="67" rx="6" fill="#eef1f2" stroke="#78868b" stroke-width="1.2"/>
<text x="373" y="250" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="start">Every 20 ms: read the stick,</text>
<text x="373" y="267" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="start">ignore the dead zone (0.18),</text>
<text x="373" y="284" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="start">direction = [1, 0, 0]</text>
<circle cx="26.0" cy="315.0" r="12" fill="#1a2b30" stroke="none" stroke-width="1.5"/>
<text x="26" y="320" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<path d="M361,320 L592,320" fill="none" stroke="#1565c0" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<text x="477.5" y="310" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#1565c0" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">drive([1, 0, 0])</text>
<rect x="608" y="338" width="210" height="67" rx="6" fill="#e3f2ef" stroke="#0d7a69" stroke-width="1.2"/>
<text x="618" y="358" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="start">Check the whole walk first:</text>
<text x="618" y="375" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="start">every foot reachable,</text>
<text x="618" y="392" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="start">every joint inside its limits</text>
<circle cx="26.0" cy="440.0" r="12" fill="#1a2b30" stroke="none" stroke-width="1.5"/>
<text x="26" y="445" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<path d="M606,445 L842,445" fill="none" stroke="#5e35b1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-purple)"/>
<text x="725.0" y="419" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#5e35b1" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">{&quot;op&quot;: &quot;walk&quot;, &quot;gait&quot;: &quot;ripple&quot;,</text>
<text x="725.0" y="435" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#5e35b1" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">&quot;period_ms&quot;: 1429, &quot;lift&quot;: 20, …}</text>
<path d="M844,480 L608,480" fill="none" stroke="#5e35b1" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#ah-purple)"/>
<text x="725.0" y="470" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#5e35b1" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">{&quot;ok&quot;: true, &quot;state&quot;: …}</text>
<rect x="858" y="497" width="210" height="84" rx="6" fill="#efeaf8" stroke="#5e35b1" stroke-width="1.2"/>
<text x="868" y="517" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="start">Every 20 ms, by itself:</text>
<text x="868" y="534" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="start">move the gait clock on,</text>
<text x="868" y="551" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="start">work out 6 foot positions,</text>
<text x="868" y="568" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="start">inverse kinematics → 18 angles</text>
<circle cx="26.0" cy="627.0" r="12" fill="#1a2b30" stroke="none" stroke-width="1.5"/>
<text x="26" y="632" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<path d="M856,632 L1072,632" fill="none" stroke="#c25e00" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-orange)"/>
<text x="965.0" y="606" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#c25e00" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">18 pulse widths</text>
<text x="965.0" y="622" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#c25e00" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">every 20 ms</text>
<circle cx="26.0" cy="695.0" r="12" fill="#1a2b30" stroke="none" stroke-width="1.5"/>
<text x="26" y="700" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<path d="M606,700 L842,700" fill="none" stroke="#0d7a69" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-teal)"/>
<text x="725.0" y="674" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d7a69" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">{&quot;op&quot;: &quot;status&quot;}  every 200 ms</text>
<text x="725.0" y="690" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d7a69" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">(every 650 ms when still)</text>
<path d="M844,735 L608,735" fill="none" stroke="#0d7a69" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#ah-teal)"/>
<text x="725.0" y="725" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d7a69" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">positions, angles, battery</text>
<rect x="608" y="752" width="210" height="84" rx="6" fill="#e3f2ef" stroke="#0d7a69" stroke-width="1.2"/>
<text x="618" y="772" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="start">Keeps the 3 s watchdog fed</text>
<text x="618" y="789" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="start">and updates the Live View.</text>
<text x="618" y="806" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="start">Steering: at most one change</text>
<text x="618" y="823" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="start">per 150 ms, if it moved ≥ 0.08</text>
<circle cx="26.0" cy="853.0" r="12" fill="#1a2b30" stroke="none" stroke-width="1.5"/>
<text x="26" y="858" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<path d="M126,858 L347,858" fill="none" stroke="#1565c0" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<text x="237.5" y="848" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1565c0" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Let go of the stick</text>
<path d="M361,890 L592,890" fill="none" stroke="#1565c0" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<text x="477.5" y="880" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#1565c0" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">drive([0, 0, 0])</text>
<circle cx="26.0" cy="930.0" r="12" fill="#1a2b30" stroke="none" stroke-width="1.5"/>
<text x="26" y="935" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<path d="M606,935 L842,935" fill="none" stroke="#5e35b1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-purple)"/>
<text x="725.0" y="909" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5e35b1" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">after a 300 ms grace period:</text>
<text x="725.0" y="925" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5e35b1" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">{&quot;op&quot;: &quot;walk_stop&quot;}</text>
<rect x="858" y="948" width="210" height="50" rx="6" fill="#efeaf8" stroke="#5e35b1" stroke-width="1.2"/>
<text x="868" y="968" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="start">Finishes the step, slows over</text>
<text x="868" y="985" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="start">one cycle, stops in the stance</text>
</svg>
