<text x="72" y="179" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d7a69" text-anchor="start">Robot state</text>
<text x="72" y="197" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a2b30" text-anchor="start">every change</text>
<path d="M260,184 L300,184" fill="none" stroke="#0d7a69" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-teal)"/>
