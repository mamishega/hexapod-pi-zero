<text x="54" y="703" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a2b30" text-anchor="start">Defaults: ripple gait · 0.7 steps per second · step height 20 mm · stride angle 15°</text>
